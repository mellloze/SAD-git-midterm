
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day and Night Toggle</title>

  <style>
    body {
      background: white;
      color: black;
      text-align: center;
      font-family: Arial, sans-serif;
      padding: 50px;
      transition: background 0.25s, color 0.25s;
    }
    #theme-toggle-button {
      display: inline-block;
      width: 70px;
      cursor: pointer;
    }

    #toggle {
      position: absolute;
      opacity: 0;
      width: 1px;
      height: 1px;
    }

    svg {
      width: 70px;
    }

    #container {
      fill: #b9d8f5;
      transition: fill 0.25s;
    }

    #button {
      fill: white;
      transition: transform 0.25s;
    }

    #toggle:checked + svg #container {
      fill: #2b4360;
    }

    #toggle:checked + svg #button {
      transform: translate(28px, 0);
    }

    #sun, #moon {
      transition: opacity 0.25s;
    }

    #sun {
      opacity: 1;
    }

    #moon {
      opacity: 0;
    }

    #toggle:checked + svg #sun {
      opacity: 0;
    }

    #toggle:checked + svg #moon {
      opacity: 1;
    }

    body.dark {
      background: #17212f;
      color: white;
    }
     </style>
</head>

<body>
  <h1>Day and Night Theme</h1>
  <p>Click the toggle to change the theme.</p>
    
    <label id="theme-toggle-button">
    <input type="checkbox" id="toggle">

    <svg viewBox="0 0 70 44" xmlns="http://www.w3.org/2000/svg">
      <rect id="container" width="70" height="44" rx="22"/>
      <circle id="button" cx="22" cy="22" r="18"/>
      <circle id="sun" cx="22" cy="22" r="7" fill="#f1c40f"/>
      <circle id="moon" cx="50" cy="22" r="7" fill="#f1c40f"/>
    </svg>
  </label>

  <script>
    const toggle = document.getElementById("toggle");

    toggle.addEventListener("change", function () {
      document.body.classList.toggle("dark", toggle.checked);
    });
  </script>
</body>
</html>
